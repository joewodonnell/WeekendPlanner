<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekend plans</title>
<meta name="description" content="Plan weekends, holidays, and days off — drag ideas onto the days you'll do them.">
<meta name="theme-color" content="#1f4fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plans">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style id="css">
/* VOICE: friendly, practical household planner — calm, quick to use
   IDEA: a fridge-door planner pad: torn-off day cards with big hanging dates
   PICTURE: the board itself — day cards with large date blocks, plan chips you drag
   COLOUR+TYPE: white ground, cobalt for weekends, tangerine for holidays, berry for days off; Archivo 800/400
   LAYOUT: header with add-day bar; ideas column left (top on phone), days grouped into stretches right */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1320);--card:light-dark(#f4f6fb,#181d2d);--ink:light-dark(#141824,#eef1f8);--mute:light-dark(#5b6275,#9aa2b8);--line:light-dark(#dde2ee,#2a3148);
--wk:light-dark(#1f4fd1,#7d9bff);--hol:light-dark(#d9530b,#ff9a5a);--off:light-dark(#b8235a,#ff7aa8);--chip:light-dark(#ffffff,#222944)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
header{background:var(--wk);color:#fff;padding:clamp(20px,3vw,36px) max(5vw,16px) 20px}
:root[data-theme=dark] header,:root:not([data-theme=light]) header{background:light-dark(#1f4fd1,#1b2a66)}
h1{margin:0;font-weight:800;font-size:clamp(32px,5vw,48px);line-height:1.05;letter-spacing:-.02em}
.sum{margin:6px 0 16px;opacity:.85}
.addday{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addday input,.addday select{height:44px;border-radius:10px;border:0;padding:0 12px;font-size:16px;background:#fff;color:#141824}
.addday .lbl{flex:1 1 160px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:0;cursor:pointer;font-weight:600}
.btn.solid{background:#ff9a3d;color:#1b1206}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn:focus-visible,input:focus-visible,select:focus-visible,.x:focus-visible,.tag:focus-visible{outline:3px solid #ffb469;outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(16px,3vw,40px);padding:24px max(5vw,16px) 80px;max-width:1240px;margin:0 auto}
aside{position:sticky;top:16px;align-self:start;background:var(--card);border-radius:16px;padding:18px}
h2{margin:0;font-size:20px;font-weight:800}
.note{margin:2px 0 12px;color:var(--mute);font-size:14px}
.group{margin-bottom:16px}
.day{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;background:var(--card);border-radius:12px;padding:8px;margin-bottom:6px;--c:var(--wk)}
.side{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.day.t-holiday{--c:var(--hol)}.day.t-off{--c:var(--off)}
.day.past{opacity:.55}
.date{display:flex;flex-direction:column;align-items:center;border-radius:10px;background:var(--c);color:#fff;padding:5px 4px;line-height:1}
.today .date{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
:root:not([data-theme=light]) .date{color:light-dark(#fff,#0f1320)}
.date .wd,.date .mo{font-size:12px;font-weight:600}
.date b{font-size:26px;font-weight:800;margin:2px 0}
.tag{border:0;border-radius:99px;padding:3px 4px;font-size:12px;line-height:1.2;font-weight:600;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);cursor:pointer;overflow-wrap:break-word}
.x{border:0;background:none;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--mute);font-size:20px;line-height:1;flex:none}
.x:hover{background:var(--line);color:var(--ink)}
.chk{border:0;background:none;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--mute);flex:none;display:grid;place-items:center}
.chk:hover{background:var(--line);color:var(--ink)}
.chk.done{color:#2a9d57}
.item.done .txt{text-decoration:line-through;color:var(--mute)}
.list{list-style:none;margin:0;padding:0;min-height:34px;display:flex;flex-direction:column;gap:4px}
.list:empty{border:2px dashed var(--line);border-radius:10px;align-items:center;justify-content:center}
.list:empty::before{content:"Drop plans here";color:var(--mute);font-size:14px}
.item{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:0 2px 0 2px;min-height:34px;cursor:grab;user-select:none}
.grip{width:24px;height:30px;display:grid;place-items:center;color:var(--mute);touch-action:none;flex:none}
.txt{flex:1;padding:3px 2px;line-height:1.3;cursor:text;overflow-wrap:anywhere}
.item input{flex:1;height:30px;border:1px solid var(--wk);border-radius:8px;padding:0 8px;font-size:16px;background:var(--bg)}
.item.ph{opacity:.35;border-style:dashed}
.floater{position:fixed;z-index:50;pointer-events:none;box-shadow:0 12px 28px rgba(10,20,50,.28);transform:rotate(-1.5deg);cursor:grabbing}
.add{display:flex;gap:4px;margin-top:4px}
.add input{flex:1;height:34px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;background:var(--bg)}
.add .btn{background:var(--ink);color:var(--bg);height:34px;padding:0 12px}
.day .x{width:30px;height:34px}
.item .x{width:30px;height:30px}
.item .chk{width:30px;height:30px}
.pastbtn{display:block;width:100%;margin-bottom:16px;background:var(--card);color:var(--mute)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
.foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;color:var(--mute);font-size:13px;margin-top:8px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:44px;padding:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;display:none;gap:12px;align-items:center;z-index:60;max-width:calc(100vw - 32px)}
#toast.on{display:flex}#toast button{background:#ff9a3d;color:#1b1206;height:40px}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}aside{position:static}}
@media(max-width:420px){.day{grid-template-columns:62px minmax(0,1fr);gap:8px;padding:6px}.date b{font-size:22px}.tag{font-size:11px;padding:3px 1px}}
@media(prefers-reduced-motion:reduce){.floater{transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"><span id="tmsg"></span><button class="btn" id="undo">Undo</button></div>
<script type="application/json" id="state">{"t":1794752019199,"sample":false,"days":[{"id":"d1","date":"2026-11-15","type":"weekend","label":""},{"id":"d2","date":"2026-11-21","type":"weekend","label":""},{"id":"d3","date":"2026-11-22","type":"weekend","label":""},{"id":"d4","date":"2026-11-25","type":"off","label":""},{"id":"d5","date":"2026-11-26","type":"holiday","label":"Thanksgiving"},{"id":"d6","date":"2026-11-27","type":"off","label":""},{"id":"d7","date":"2026-11-28","type":"weekend","label":""},{"id":"d8","date":"2026-11-29","type":"weekend","label":""},{"id":"d9","date":"2026-12-05","type":"weekend","label":""},{"id":"d10","date":"2026-12-06","type":"weekend","label":""},{"id":"d11","date":"2026-12-12","type":"weekend","label":""},{"id":"d12","date":"2026-12-13","type":"weekend","label":""},{"id":"d13","date":"2026-12-19","type":"weekend","label":""},{"id":"d14","date":"2026-12-20","type":"weekend","label":""}],"items":[{"id":"i8","text":"Decide Thanksgiving plans","day":"d1"},{"id":"i16","text":"Work on the playground","day":"d1"},{"id":"i9","text":"Plan and pack hospital bag","day":"d1"},{"id":"i5","text":"Prius oil change","day":"d2"},{"id":"i7","text":"Jeep inspection","day":"d2"},{"id":"i3","text":"Wash baby clothes","day":"d2"},{"id":"i10","text":"Review birth plan","day":"d2"},{"id":"i6","text":"Prius inspection","day":"d2"},{"id":"i2","text":"Clean and install car seat","day":"d2"},{"id":"i4","text":"Set up cradle in bedroom","day":"d3"},{"id":"i11","text":"Go to Costco","day":"d3"},{"id":"i12","text":"Detail the Prius","day":"d4"},{"id":"i13","text":"Detail the Jeep","day":"d4"},{"id":"i14","text":"Install sink","day":"d4"},{"id":"i15","text":"Move William's small clothes to the attic","day":"d6"},{"id":"i1","text":"Move shelf out of bedroom into attic","day":"d6"},{"id":"i17","text":"Clean out toybox","day":"d7"}]}</script>
<script>
{
const SRC = document.currentScript.textContent;
const KEY = 'weekend-plans-v1';
const TYPES = {weekend:'Weekend', holiday:'Holiday', off:'Day off'};
const NEXT = {weekend:'holiday', holiday:'off', off:'weekend'};
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const app = document.getElementById('app');
const toast = document.getElementById('toast');

let S = JSON.parse(document.getElementById('state').textContent);
try { const L = JSON.parse(localStorage.getItem(KEY)); if (L && L.t > S.t) S = L; } catch (e) {}
// A copy saved before per-plan merging (no S.gone) gets matched against the server once, on the first sync.
let legacy = S.gone ? null : JSON.parse(JSON.stringify(S));
S = normalize(S);

let showPast = false, undoSnap = null, toastTimer = 0, refocus = null, pubTimer = 0, art = null, canPub = true;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const diff = s => Math.round((parse(s) - today()) / 864e5);
const touch = r => { r.u = Date.now(); return r; };
function kill(kind, id) { S.gone[id] = Date.now(); S[kind] = S[kind].filter(r => r.id !== id); }
const nextO = day => Math.max(-1, ...S.items.filter(i => i.day === day).map(i => i.o)) + 1;
const byOrder = (a, b) => a.o - b.o || (a.id < b.id ? -1 : 1);

function rel(s) {
  const n = diff(s);
  if (n < 0) return 'Past';
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return 'This week';
  return 'in ' + n + ' days';
}

const checkSVG = done => done
  ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.5 8.2l2.4 2.4L11.5 6" stroke="var(--chip)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  : `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.2"/><path d="M4.8 8.2l2.2 2.2L11.3 6.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function itemHTML(it) {
  return `<li class="item${it.done ? ' done' : ''}" data-id="${it.id}"><span class="grip" title="Drag"><svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg></span><span class="txt">${esc(it.text)}</span><button class="chk${it.done ? ' done' : ''}" data-act="toggleitem" aria-pressed="${it.done ? 'true' : 'false'}" aria-label="${it.done ? 'Mark not done' : 'Mark done'}">${checkSVG(it.done)}</button><button class="x" data-act="delitem" aria-label="Delete plan">×</button></li>`;
}
const listHTML = day => `<ul class="list" data-day="${day || ''}">${S.items.filter(i => i.day === day).sort(byOrder).map(itemHTML).join('')}</ul>`;
const addHTML = (day, ph) => `<form class="add" data-day="${day || ''}"><input name="t" placeholder="${ph}" aria-label="${ph}" autocomplete="off"><button class="btn">Add</button></form>`;

function dayHTML(d) {
  const dt = parse(d.date);
  return `<section class="day t-${d.type}${diff(d.date) < 0 ? ' past' : ''}${diff(d.date) === 0 ? ' today' : ''}" data-id="${d.id}">
    <div class="side"><div class="date" title="${rel(d.date)}"><span class="wd">${WD[dt.getDay()]}</span><b>${dt.getDate()}</b><span class="mo">${MO[dt.getMonth()]}</span></div><button class="tag" data-act="type" title="${TYPES[d.type]} — click to change type">${d.label ? esc(d.label) : TYPES[d.type]}</button></div>
    <div>${listHTML(d.id)}<form class="add" data-day="${d.id}"><input name="t" placeholder="Add a plan…" aria-label="Add a plan" autocomplete="off"><button class="btn">Add</button><button type="button" class="x" data-act="delday" title="Remove this day" aria-label="Remove day"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg></button></form></div></section>`;
}

function groups(days) {
  const out = [];
  days.forEach(d => {
    const g = out[out.length - 1];
    if (g && Math.round((parse(d.date) - parse(g[g.length - 1].date)) / 864e5) === 1) g.push(d); else out.push([d]);
  });
  return out;
}
function gTitle(g) {
  const a = parse(g[0].date), b = parse(g[g.length - 1].date);
  const f = (d, m) => WD[d.getDay()] + ' ' + d.getDate() + (m ? ' ' + MO[d.getMonth()] : '');
  return g.length === 1 ? f(a, 1) : f(a, a.getMonth() !== b.getMonth()) + ' – ' + f(b, 1);
}

function render() {
  S.days.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const past = S.days.filter(d => diff(d.date) < 0);
  const shown = showPast ? S.days : S.days.filter(d => diff(d.date) >= 0);
  const planned = S.items.filter(i => i.day).length, ideas = S.items.length - planned;
  const nd = new Date(); const def = iso(nd);
  app.innerHTML = `<header><h1>Weekend plans</h1>
    <p class="sum">${shown.length} day${shown.length === 1 ? '' : 's'} ahead · ${planned} planned · ${ideas} idea${ideas === 1 ? '' : 's'} waiting<span id="sync">${syncText()}</span></p>
    <form class="addday" id="addday"><input type="date" name="date" value="${def}" aria-label="Date" required>
      <select name="type" aria-label="Kind of day"><option value="weekend">Weekend</option><option value="holiday">Holiday</option><option value="off">Day off</option></select>
      <input class="lbl" name="label" placeholder="Name (optional), e.g. Christmas" aria-label="Name">
      <button class="btn solid">Add day</button><button type="button" class="btn ghost" data-act="nextwk">+ Next free weekend</button></form></header>
  <main><aside><h2>Ideas</h2><p class="note">Not on a day yet — drag onto one.</p>${listHTML(null)}${addHTML(null, 'Add an idea…')}
    <div class="foot">${S.sample ? '<span>Sample plans to start from.</span>' : ''}<button class="link" data-act="clear">Clear everything</button></div></aside>
  <div>${past.length ? `<button class="btn pastbtn" data-act="past">${showPast ? 'Hide' : 'Show'} ${past.length} past day${past.length === 1 ? '' : 's'}</button>` : ''}
    ${shown.length ? groups(shown).map(g => `<div class="group">${g.map(dayHTML).join('')}</div>`).join('') : '<div class="empty">No days yet. Add a date above, or tap “Next free weekend”.</div>'}
  </div></main>`;
  if (refocus !== null) { const f = app.querySelector(`.add[data-day="${refocus}"] input`); if (f) f.focus(); refocus = null; }
}

function docHTML() {
  const css = document.getElementById('css').textContent;
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Weekend plans</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">\n<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="app"></div>\n<div id="toast" role="status"><span id="tmsg"></span><button class="btn" id="undo">Undo</button></div>\n<script type="application/json" id="st' + 'ate">' + json + '</scr' + 'ipt>\n<script>' + SRC + '</scr' + 'ipt>\n</body>\n</html>\n';
}

function schedulePublish() {
  clearTimeout(pubTimer);
  if (!art || !canPub) return;
  pubTimer = setTimeout(async () => {
    const a = document.activeElement;
    if (drag || (a && a.tagName === 'INPUT' && a.value)) return schedulePublish();
    try { await art.publish(docHTML()); }
    catch (e) { if (/not_granted|not_writer/.test(String(e && (e.code || e.message || e)))) canPub = false; }
  }, 2500);
}

/* ---- sync with the home server (server.py) ---- */
const API = 'api/v2/state';
let sync = null, pushTimer = 0, pulling = false;
const syncText = () => sync === 'ok' ? ' · Synced' : sync === 'offline' ? ' · Offline, saved on this device' : '';
function setSync(v) { sync = v; const el = document.getElementById('sync'); if (el) el.textContent = syncText(); }
const busy = () => { const a = document.activeElement; return drag || (a && (a.tagName === 'SELECT' || (a.tagName === 'INPUT' && (a.value || !a.closest('.add'))))); };
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* Every day and plan carries its own edit time (u); deleted ids stay in S.gone with the deletion time.
   normalize() and merge() must match the ones in server.py so both sides settle on the same list. */
function normalize(s) {
  const t = s.t || 0;
  return {t, sample: !!s.sample, gone: {...(s.gone || {})},
    days: s.days.map(d => ({...d, u: d.u ?? t})),
    items: s.items.map((it, i) => ({...it, u: it.u ?? t, o: it.o ?? i}))};
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const gone = {...a.gone};
  for (const [k, v] of Object.entries(b.gone)) if (v > (gone[k] || 0)) gone[k] = v;
  const out = {gone, sample: (a.t >= b.t ? a : b).sample};
  let t = Math.max(a.t, b.t, ...Object.values(gone));
  for (const kind of ['days', 'items']) {
    const best = new Map();
    for (const r of [...a[kind], ...b[kind]]) { const c = best.get(r.id); if (!c || r.u > c.u) best.set(r.id, r); }
    out[kind] = [...best.values()].filter(r => r.u > (gone[r.id] ?? -1));
    out[kind].forEach(r => { if (r.u > t) t = r.u; });
  }
  const ids = new Set(out.days.map(d => d.id));
  out.items = out.items.map(it => it.day && !ids.has(it.day) ? {...it, day: null} : it);
  out.t = t;
  return out;
}
function rec(r) { return JSON.stringify(r, Object.keys(r).sort()); }
function sig(s) { return JSON.stringify([s.days.map(rec).sort(), s.items.map(rec).sort(), Object.entries(s.gone).sort()]); }
// Converts a pre-merging copy L against the server copy R: records that match take the server's, records changed
// here are stamped with L's last edit time, and records on only one side follow whichever copy is newer.
function upgrade(L, R) {
  const newer = L.t > R.t, out = {t: Math.max(L.t, R.t), sample: L.sample, gone: {...R.gone}, days: [], items: []};
  const same = {days: (x, y) => x.date === y.date && x.type === y.type && (x.label || '') === (y.label || ''),
                items: (x, y) => x.text === y.text && (x.day || null) === (y.day || null) && !!x.done === !!y.done};
  for (const kind of ['days', 'items']) {
    const theirs = new Map(R[kind].map(r => [r.id, r])), mine = new Set(L[kind].map(r => r.id));
    L[kind].forEach((r, i) => {
      const s = theirs.get(r.id);
      if (s) out[kind].push(same[kind](r, s) ? s : {...s, ...r, u: L.t});
      else if (newer) out[kind].push(kind === 'items' ? {...r, o: i, u: L.t} : {...r, u: L.t});
    });
    R[kind].forEach(s => { if (!mine.has(s.id)) { if (newer) out.gone[s.id] = Math.max(out.gone[s.id] || 0, L.t); else out[kind].push(s); } });
  }
  return out;
}
function adopt(R) {
  const f = document.activeElement && document.activeElement.closest && document.activeElement.closest('.add');
  if (f) refocus = f.dataset.day;
  S = R; undoSnap = null; toast.classList.remove('on');
  save();
  render();
}
async function pull() {
  if (pulling) return;
  pulling = true;
  try {
    const res = await fetch(API, {cache: 'no-store'});
    if (!res.ok) { if (sync || res.status !== 404) setSync('offline'); return; }
    const R = (await res.json()).state;
    setSync('ok');
    if (legacy && R) {
      const since = legacy.t, recent = r => r.u > since;
      adopt(merge(upgrade(legacy, R), {t: S.t, days: S.days.filter(recent), items: S.items.filter(recent),
        gone: Object.fromEntries(Object.entries(S.gone).filter(([, v]) => v > since))}));
    }
    legacy = null;
    if (!R) return push(0);
    const M = merge(R, S);
    if (sig(M) !== sig(S) && !busy()) adopt(M);
    if (sig(M) !== sig(R)) push(0);
  } catch (e) { setSync('offline'); }
  finally { pulling = false; }
}
function push(delay = 400) {
  if (!sync) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      const res = await fetch(API, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(S)});
      if (!res.ok) throw new Error(res.status);
      const M = merge((await res.json()).state, S);
      if (sig(M) !== sig(S) && !busy()) adopt(M);
      setSync('ok');
    } catch (e) { setSync('offline'); }
  }, delay);
}

function commit(msg) {
  S.t = Date.now();
  save();
  render();
  schedulePublish();
  push();
  if (msg) showToast(msg);
}
function snap() { undoSnap = JSON.stringify(S); }
function showToast(msg) {
  document.getElementById('tmsg').textContent = msg;
  toast.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 6000);
}
document.getElementById('undo').addEventListener('click', () => {
  if (!undoSnap) return;
  // Undo is recorded as new changes (fresh edit times, new deletions) so it wins when merged with other devices.
  const old = JSON.parse(undoSnap), t = Date.now();
  for (const kind of ['days', 'items']) {
    const cur = new Map(S[kind].map(r => [r.id, r])), keep = new Set(old[kind].map(r => r.id));
    S[kind].forEach(r => { if (!keep.has(r.id)) S.gone[r.id] = t; });
    S[kind] = old[kind].map(r => { const c = cur.get(r.id); return c && rec(c) === rec(r) ? c : {...r, u: t}; });
  }
  undoSnap = null; toast.classList.remove('on'); commit();
});

function addDay(date, type, label) {
  if (S.days.some(d => d.date === date)) return false;
  S.days.push({id: uid('d'), date, type, label, u: Date.now()}); return true;
}

app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'addday') {
    const date = f.date.value; if (!date) return;
    if (!addDay(date, f.type.value, f.label.value.trim())) return showToast('That date is already on the list.');
    S.sample = false; undoSnap = null; commit(); return;
  }
  const t = f.t.value.trim(); if (!t) return;
  const day = f.dataset.day || null;
  S.items.push({id: uid('i'), text: t, day, o: nextO(day), u: Date.now()}); S.sample = false;
  refocus = f.dataset.day; commit();
});

app.addEventListener('click', e => {
  if (justDragged) return;
  const b = e.target.closest('[data-act]');
  const txt = e.target.closest('.txt');
  if (txt && !b) return editItem(txt.closest('.item'));
  if (!b) return;
  const act = b.dataset.act, dayEl = b.closest('.day'), itEl = b.closest('.item');
  if (act === 'delitem') {
    snap(); const it = S.items.find(i => i.id === itEl.dataset.id);
    kill('items', it.id); commit('Deleted “' + it.text + '”');
  } else if (act === 'toggleitem') {
    const it = S.items.find(i => i.id === itEl.dataset.id); it.done = !it.done; touch(it); commit();
  } else if (act === 'delday') {
    snap(); const id = dayEl.dataset.id, moved = S.items.filter(i => i.day === id), n = moved.length;
    let o = nextO(null);
    moved.forEach(i => { i.day = null; i.o = o++; touch(i); });
    kill('days', id);
    commit('Day removed' + (n ? ` — ${n} plan${n === 1 ? '' : 's'} moved to Ideas` : ''));
  } else if (act === 'type') {
    const d = S.days.find(x => x.id === dayEl.dataset.id); d.type = NEXT[d.type]; touch(d); commit();
  } else if (act === 'nextwk') {
    const d = today(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7));
    for (let k = 0; k < 104; k++, d.setDate(d.getDate() + 7)) {
      const sat = iso(d), sun = new Date(d); sun.setDate(sun.getDate() + 1);
      const a = addDay(sat, 'weekend', ''), c = addDay(iso(sun), 'weekend', '');
      if (a || c) { S.sample = false; undoSnap = null; commit(); return; }
    }
  } else if (act === 'past') { showPast = !showPast; render(); }
  else if (act === 'clear') {
    snap(); const t = Date.now();
    [...S.days, ...S.items].forEach(r => { S.gone[r.id] = t; });
    S.days = []; S.items = []; S.sample = false; commit('Cleared everything');
  }
});

function editItem(li) {
  const it = S.items.find(i => i.id === li.dataset.id); if (!it) return;
  const span = li.querySelector('.txt');
  const inp = document.createElement('input'); inp.value = it.text; inp.setAttribute('aria-label', 'Edit plan');
  span.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = save => { if (done) return; done = true; const v = inp.value.trim(); if (save && v && v !== it.text) { it.text = v; touch(it); commit(); } else render(); };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

/* ---- drag & drop with pointer events (works with mouse and touch) ---- */
let drag = null, justDragged = false;
app.addEventListener('pointerdown', e => {
  const li = e.target.closest('.item');
  if (!li || e.button > 0 || e.target.closest('button,input')) return;
  if (e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = {li, x: e.clientX, y: e.clientY, on: false};
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const r = drag.li.getBoundingClientRect();
    drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top;
    drag.g = drag.li.cloneNode(true); drag.g.classList.add('floater'); drag.g.style.width = r.width + 'px';
    document.body.appendChild(drag.g); drag.li.classList.add('ph'); drag.on = true;
  }
  e.preventDefault();
  drag.g.style.left = (e.clientX - drag.dx) + 'px'; drag.g.style.top = (e.clientY - drag.dy) + 'px';
  if (e.clientY < 70) scrollBy(0, -14); else if (e.clientY > innerHeight - 70) scrollBy(0, 14);
  const el = document.elementFromPoint(e.clientX, e.clientY);
  let list = el && el.closest('.list');
  if (!list) { const host = el && el.closest('.day,aside'); list = host && host.querySelector('.list'); }
  if (!list) return;
  const sibs = [...list.querySelectorAll('.item')].filter(x => x !== drag.li);
  const before = sibs.find(x => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  if (before) { if (drag.li.nextElementSibling !== before) list.insertBefore(drag.li, before); }
  else if (list.lastElementChild !== drag.li) list.appendChild(drag.li);
}, {passive: false});
function endDrag() {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) return;
  d.g.remove();
  justDragged = true; setTimeout(() => justDragged = false, 50);
  const id = d.li.dataset.id, list = d.li.closest('.list');
  const it = S.items.find(i => i.id === id);
  // Only the moved plan changes: its order number lands between its new neighbours'.
  const oOf = el => el ? S.items.find(i => i.id === el.dataset.id)?.o : undefined;
  const prev = oOf(d.li.previousElementSibling), next = oOf(d.li.nextElementSibling);
  it.day = list.dataset.day || null;
  it.o = prev != null && next != null ? (prev + next) / 2 : prev != null ? prev + 1 : next != null ? next - 1 : 0;
  touch(it);
  commit();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

render();
if (window.claude && window.claude.use) window.claude.use('artifact').then(a => { art = a; }).catch(() => {});

pull();
setInterval(() => { if (sync && document.visibilityState === 'visible') pull(); }, 5000);
document.addEventListener('visibilitychange', () => { if (sync && document.visibilityState === 'visible') pull(); });
window.addEventListener('online', () => pull());

if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) return;
    // Edits are already saved on the device, so a reload loses nothing.
    if (busy()) showToast('App updated — reload to get the latest.'); else location.reload();
  });
}
}
</script>
</body>
</html>
